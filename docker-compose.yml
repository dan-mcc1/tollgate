services:
  db:
    image: pgvector/pgvector:pg17 # PostgreSQL with pgvector support
    container_name: pgvector-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: example_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d example_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  mock-upstream:
    build:
      context: .
      dockerfile: mock_upstream/Dockerfile
    container_name: mock-gemini
    environment:
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.7-flash}
      MOCK_LATENCY_MS: ${MOCK_LATENCY_MS:-100}
      MOCK_CHUNK_DELAY_MS: ${MOCK_CHUNK_DELAY_MS:-40}
      MOCK_ERROR_RATE: ${MOCK_ERROR_RATE:-0}
    ports:
      - "8001:8001"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/')"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:

[project]
name = "tollgate"
version = "0.1.0"
description = "Multi-tenant reverse proxy for model APIs: auth, spend limits, caching, inspection, token accounting."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.16",
    "asyncpg>=0.30",
    "fastapi>=0.135",
    "httpx>=0.28",
    "pydantic-settings>=2.10",
    "redis>=5.2",
    "sqlalchemy[asyncio]>=2.0.43",
    "uvicorn[standard]>=0.44",
]

[project.scripts]
tollgate = "tollgate.cli:main"

[dependency-groups]
dev = [
    "mypy>=1.18",
    "pytest>=8.4",
    "pytest-asyncio>=1.2",
    "ruff>=0.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tollgate"]

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["venv"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "B",        # bugbear
    "UP",       # pyupgrade
    "SIM",      # simplify
    "ASYNC",    # async pitfalls
    "RUF",
]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["src", "mock_upstream", "migrations", "tests"]
exclude = ["^venv/"]
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

name: CI

# Runs on every pull request, and is called by the deploy workflow before anything ships,
# so a commit that fails here can never reach AWS.
on:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    name: Lint, types, tests, audit
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: example_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_REDIS_URL: redis://localhost:6379/0
      TEST_DATABASE_URL: postgresql+asyncpg://postgres:password@localhost:5432/tollgate_test
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.1.0
      - run: uv sync --locked

      # The classifier's graph is a build artefact, not a file in the repository, so without
      # this the tests that load a real model skip themselves and CI never finds out that a
      # repinned revision no longer loads - or that its labels have been swapped. Cached on
      # the pinned revision, so it is one 18 MB download per repin rather than per run.
      - name: Restore the pinned classifier
        id: model-cache
        uses: actions/cache@v4
        with:
          path: models
          key: detector-${{ hashFiles('src/tollgate/detect/classifier.py') }}
      - name: Fetch the pinned classifier
        if: steps.model-cache.outputs.cache-hit != 'true'
        run: uv run python -m tollgate.detect.fetch tiny

      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest

      # ECR's image scan only covers OS packages. This covers the Python dependencies,
      # exactly as pinned in uv.lock (with hashes), against the PyPI advisory database.
      - name: Audit Python dependencies
        run: |
          uv export --frozen --no-dev --no-emit-project --format requirements-txt -o requirements-audit.txt
          uvx pip-audit -r requirements-audit.txt --disable-pip --progress-spinner off

  image:
    name: Docker image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Catch a broken Dockerfile in the pull request, not during a deploy.
      - run: docker build --pull --provenance=false --sbom=false -t tollgate:ci .

      # Importing the app inside the image needs nothing running, and it reads the landing
      # page off the installed package - so a wheel that stopped carrying static/index.html
      # fails here rather than as a crash loop on deploy.
      - name: The installed package imports and carries its static files
        run: docker run --rm tollgate:ci python -c "import tollgate.main"
